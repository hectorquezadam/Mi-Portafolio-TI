{% extends 'base.html' %}

{% block content %}
<div class="bg-dark text-light d-flex justify-content-center align-items-center" style="min-height: 85vh; background: radial-gradient(circle at center, #1e1e1e 0%, #121212 100%);">
    <div class="col-12 col-md-6 col-lg-4 px-3">
        
        <div class="card shadow-lg border-secondary p-4" style="border-radius: 2rem; background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1) !important;">
            <div class="card-body">
                
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary display-6">Iniciar Sesión</h3>
                    <p class="text-muted small">Bienvenido de vuelta, Player 1</p>
                    <hr class="mx-auto border-primary" style="width: 50px; height: 3px; opacity: 1;">
                </div>
                
                {% if form.errors %}
                <div class="alert alert-danger alert-dismissible fade show small bg-dark text-danger border-danger" role="alert" style="border-radius: 1rem;">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <strong>Credenciales incorrectas</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-warning small">Nombre de usuario o Email</label>
                        <input type="text" 
                               class="form-control form-control-lg bg-dark text-white border-secondary custom-input" 
                               id="username" name="username" 
                               placeholder="Tu usuario o correo" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-warning small">Contraseña</label>
                        <input type="password" 
                               class="form-control form-control-lg bg-dark text-white border-secondary custom-input" 
                               id="password" name="password" 
                               placeholder="••••••••" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg shadow fw-bold py-3 btn-login">
                            INGRESAR <i class="bi bi-box-arrow-in-right ms-2"></i>
                        </button>
                    </div>
                </form>

                <hr class="my-4" style="border-color: rgba(255,255,255,0.1);">

                <div class="text-center">
                    <p class="mb-1 text-muted small">¿Aún no eres miembro del club?</p>
                    <a href="{% url 'register' %}" class="text-decoration-none fw-bold text-warning hover-register">
                        Regístrate AQUÍ
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Estilos para los campos de texto */
    .custom-input {
        border-radius: 1rem !important;
        font-size: 0.95rem !important;
        transition: all 0.3s ease;
    }
    .custom-input:focus {
        background-color: #000 !important;
        border-color: #0d6efd !important;
        box-shadow: 0 0 10px rgba(13, 110, 253, 0.3) !important;
        color: white !important;
    }

    /* Botón de ingreso estilo gamer */
    .btn-login {
        border-radius: 1rem !important;
        letter-spacing: 1px;
        transition: all 0.3s ease;
    }
    .btn-login:hover {
        background-color: #0b5ed7;
        transform: scale(1.02);
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4) !important;
    }

    /* Enlace de registro */
    .hover-register {
        transition: 0.3s;
    }
    .hover-register:hover {
        color: #ffc107 !important;
        text-shadow: 0 0 8px rgba(255, 193, 7, 0.5);
    }

    /* Placeholder color */
    ::placeholder {
        color: #555 !important;
        opacity: 1;
    }
</style>
{% endblock %}
